# Posts the daily Printer Maintenance reminder to the Google Chat "Printing" space.
# Manual re-send / test post. The daily reminder is now posted by printer-maintenance-build.yml; this still runs
# if someone pushes reminder.txt by hand.
# The webhook URL lives in the repo secret PRINTING_CHAT_WEBHOOK (Settings > Secrets and variables > Actions),
# never in this file or anywhere else in the repo.
name: Printing reminder

on:
  push:
    branches: [main]
    paths: [printer-maintenance/data/reminder.txt]
  workflow_dispatch:
    inputs:
      message:
        description: "Optional test text to post instead of reminder.txt"
        required: false
        default: ""

concurrency:
  group: printing-reminder
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post reminder to Google Chat
        env:
          WEBHOOK: ${{ secrets.PRINTING_CHAT_WEBHOOK }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::PRINTING_CHAT_WEBHOOK secret is not set; nothing posted."
            exit 0
          fi
          if [ -n "$MESSAGE" ]; then
            body=$(jq -n --arg t "$MESSAGE" '{text: $t}')
          elif [ -f printer-maintenance/data/reminder.txt ]; then
            body=$(jq -Rs '{text: .}' printer-maintenance/data/reminder.txt)
          else
            echo "::warning::No reminder.txt yet and no test message; nothing posted."
            exit 0
          fi
          for attempt in 1 2; do
            code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$WEBHOOK" \
              -H 'Content-Type: application/json; charset=UTF-8' --data "$body") || code=000
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          head -c 300 resp.txt; echo
          exit 1
